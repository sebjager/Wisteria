[Profile]
name=Donkey Kong Bananza
notes=Values from MythosOfs/Orchid's per-title settings (game_settings.cpp, commits 9fde8ccdcd and f92266e8db), measured there on a RX 9070 XT. Not yet measured in this fork. GPU accuracy High keeps the GPU thread split off and the game slows down below 30 fps; Low without reactive flushing keeps it at speed. The game times its GPU work with query timestamps and drops its resolution and frame rate at the Normal GPU clock, so the clock stays at Boost.

[Settings]
; Low enables the GPU thread split
gpu_accuracy=Low
use_reactive_flushing=false
fast_gpu_time=Boost
